name: Publish Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (must match all manifests)'
        required: true
        type: string

jobs:
  # Gate: resolve the version, verify every manifest matches, expose flags
  # downstream jobs use to decide whether to actually push to registries.
  validate:
    name: Validate version + manifests
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "release" ]]; then
            TAG="${{ github.event.release.tag_name }}"
            VERSION="${TAG#v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          if [[ -z "$VERSION" ]]; then
            echo "::error::Empty version"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "Resolved prerelease version: $VERSION"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "Resolved stable version: $VERSION"
          fi

      - name: Verify every manifest pins the same version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          fail=0
          check() {
            local label="$1" file="$2" expected="$3" actual="$4"
            if [[ "$actual" != "$expected" ]]; then
              echo "::error file=$file::$label version ($actual) != expected ($expected)"
              fail=1
            else
              echo "ok: $label = $actual ($file)"
            fi
          }

          CARGO=$(grep -m1 '^version' Cargo.toml | sed -E 's/version = "([^"]+)"/\1/')
          check "Cargo.toml" Cargo.toml "$VERSION" "$CARGO"

          PYPROJECT=$(grep -m1 '^version' pyproject.toml | sed -E 's/version = "([^"]+)"/\1/')
          check "pyproject.toml" pyproject.toml "$VERSION" "$PYPROJECT"

          NODE=$(python3 -c 'import json;print(json.load(open("bindings/node/package.json"))["version"])')
          check "bindings/node/package.json" bindings/node/package.json "$VERSION" "$NODE"

          WASM=$(python3 -c 'import json;print(json.load(open("bindings/wasm/package.json"))["version"])')
          check "bindings/wasm/package.json" bindings/wasm/package.json "$VERSION" "$WASM"

          # Java: first <version> appearing before <dependencies> — that's the
          # project's own version, not a dep pin.
          JAVA=$(python3 -c 'import re; xml=open("bindings/java/meta-oxide-java/pom.xml").read(); head=xml.split("<dependencies>",1)[0]; m=re.search(r"<version>\s*([^<\s]+)\s*</version>", head); print(m.group(1) if m else "")')
          check "bindings/java/pom.xml" bindings/java/meta-oxide-java/pom.xml "$VERSION" "$JAVA"

          if [[ -f bindings/csharp/MetaOxide/MetaOxide.csproj ]]; then
            CSHARP=$(grep -m1 -oE '<Version>[^<]+</Version>' bindings/csharp/MetaOxide/MetaOxide.csproj | sed -E 's|<Version>([^<]+)</Version>|\1|')
            check "bindings/csharp/MetaOxide.csproj" bindings/csharp/MetaOxide/MetaOxide.csproj "$VERSION" "$CSHARP"
          fi

          if [[ $fail -ne 0 ]]; then
            echo "::error::Manifest versions do not all agree. Bump them before tagging."
            exit 1
          fi
          echo "All manifests agree: $VERSION"

      - name: Generate release notes (informational)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          chmod +x .github/scripts/extract-release-notes.sh
          .github/scripts/extract-release-notes.sh "$VERSION"
          echo "=== release-title.txt ==="
          cat release-title.txt
          echo "=== release-notes.md (head) ==="
          head -40 release-notes.md || true

  # Publish to crates.io (Rust) — stable only
  publish-rust:
    name: Publish to crates.io
    needs: validate
    if: needs.validate.outputs.is_prerelease == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish dry-run
        run: cargo publish --dry-run

      - name: Publish to crates.io
        if: secrets.CARGO_TOKEN != ''
        run: cargo publish --token "${{ secrets.CARGO_TOKEN }}"

  # Build Python wheels — always run (we upload as artifacts even for prereleases)
  build-python-wheels:
    name: Build Python wheels
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            python-version: "3.11"
            target: x86_64-apple-darwin
          - os: macos-latest
            python-version: "3.11"
            target: aarch64-apple-darwin
          - os: windows-latest
            python-version: "3.11"
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install maturin
        run: pip install maturin

      - name: Build wheels
        run: maturin build --release --target ${{ matrix.target }}
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: '1'

      - name: Upload wheels as artifacts
        uses: actions/upload-artifact@v6
        with:
          name: python-wheels-${{ matrix.target }}
          path: target/wheels/
          retention-days: 5
          if-no-files-found: warn

  # Publish wheels to PyPI — stable only
  publish-python:
    name: Publish Python to PyPI
    needs: [validate, build-python-wheels]
    if: needs.validate.outputs.is_prerelease == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all wheel artifacts
        uses: actions/download-artifact@v7
        with:
          path: all-wheels
          pattern: python-wheels-*

      - name: Organize wheels
        run: |
          mkdir -p wheels
          find all-wheels -type f -name "*.whl" -exec cp {} wheels/ \;

          echo "=== Downloaded wheels ==="
          ls -lh wheels/
          wheel_count=$(find wheels -name "*.whl" | wc -l)
          echo "Total wheels found: $wheel_count"
          if [ "$wheel_count" -lt 4 ]; then
            echo "Warning: Expected at least 4 wheels, found $wheel_count"
          fi

      - name: Install build dependencies
        run: pip install twine

      - name: Publish to PyPI
        if: secrets.MATURIN_PYPI_TOKEN != ''
        run: |
          twine upload wheels/* \
            -u __token__ \
            -p "${{ secrets.MATURIN_PYPI_TOKEN }}" \
            --skip-existing \
            --non-interactive

  # Publish to npm (Node.js) — stable only
  publish-npm:
    name: Publish to npm
    needs: validate
    if: needs.validate.outputs.is_prerelease == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          registry-url: 'https://registry.npmjs.org'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        working-directory: ./bindings/node
        run: npm ci

      - name: Build
        working-directory: ./bindings/node
        run: npm run build
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: '1'

      - name: Publish
        working-directory: ./bindings/node
        if: secrets.NPM_TOKEN != ''
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Create release summary
  release-summary:
    name: Create Release Summary
    needs: [validate, publish-rust, publish-python, publish-npm]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create release summary
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          IS_PRERELEASE: ${{ needs.validate.outputs.is_prerelease }}
        run: |
          echo "✅ Release Publishing Summary ($VERSION)"
          echo "========================================"
          echo ""
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            echo "🧪 Prerelease detected — registries skipped on purpose."
          fi
          echo ""
          echo "Registry Publishing Status:"
          echo "  Rust (crates.io): ${{ needs.publish-rust.result }}"
          echo "  Python (PyPI):    ${{ needs.publish-python.result }}"
          echo "  Node.js (npm):    ${{ needs.publish-npm.result }}"
          echo ""
          echo "For Java and C# bindings:"
          echo "  🔧 Currently skipped (add when needed)"

  # Verify published packages (stable only)
  verify:
    name: Verify Published Packages
    needs: [validate, publish-rust, publish-python, publish-npm]
    if: always() && !cancelled() && needs.validate.outputs.is_prerelease == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Verify crates.io
        if: needs.publish-rust.result == 'success'
        run: cargo search meta_oxide --limit 1 || echo "Package may take time to appear on crates.io"

      - name: Verify PyPI
        if: needs.publish-python.result == 'success'
        run: pip index versions meta-oxide 2>/dev/null || echo "Package may take time to appear on PyPI"

      - name: Verify npm
        if: needs.publish-npm.result == 'success'
        run: npm view meta-oxide 2>/dev/null || echo "Package may take time to appear on npm"
